name: Deploy demo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble demo site
        run: |
          mkdir -p _site/logos
          cp -R experiences/app-prequalification/demo/. _site/
          cp -R experiences/app-prequalification/logos/. _site/logos/
      - name: Upload demo site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy demo site
        id: deployment
        uses: actions/deploy-pages@v4
