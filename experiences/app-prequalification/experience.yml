journey:
  primary_steps:
    - "Choose a product and start prequalification"
    - "Enter basic personal details"
    - "Verify identity with a one-time passcode"
    - "Review simulated offer or next step"
    - "Continue to a full application or exit"
  screen_gallery:
    - name: "Product entry"
      step: "awareness"
      description: "Introduces prequalification and sets expectations before data entry."
      device: "desktop and mobile"
    - name: "Personal details"
      step: "prequalification"
      description: "Collects the minimum information needed to begin a simulated check."
      device: "desktop and mobile"
    - name: "Verification"
      step: "verification"
      description: "Uses a simulated one-time passcode to demonstrate recovery and error states."
      device: "desktop and mobile"
    - name: "Result"
      step: "decision"
      description: "Shows an offer, a request for more information, or a decline path."
      device: "desktop and mobile"
  upstream_experiences: []
  downstream_experiences: ["Full application"]
  scenarios:
    - id: "approved-offer"
      name: "Offer available"
      description: "The customer receives a simulated offer and can continue to the full application."
    - id: "verification-required"
      name: "More verification needed"
      description: "The customer is asked for additional information before a result can be shown."
    - id: "declined"
      name: "No offer"
      description: "The customer receives a neutral simulated result and a path back to product discovery."

